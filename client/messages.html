<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сообщения — Маркет</title>
  <meta name="description" content="Встроенный чат Маркета: переписка с продавцами и покупателями, вложения и история договорённостей.">
  <meta name="theme-color" content="#0A2540">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body data-requires-auth="true">
  <a class="skip-link" href="#main">Перейти к содержимому</a>
  <header class="site-header" data-site-header></header>

  <main id="main">
    <h1 class="visually-hidden">Сообщения</h1>

    <div class="chat-shell">
      <div class="chat-list">
        <div class="chat-list__head">
          <h2 style="font-size:20px;display:flex;align-items:center;gap:8px">
            Диалоги
          </h2>
          <div class="chat-list__search">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label class="visually-hidden" for="chat-search">Поиск по диалогам</label>
            <input class="input" id="chat-search" type="search" placeholder="Поиск по имени или объявлению">
          </div>
        </div>
        <div class="chat-list__scroll" id="chat-items" aria-live="polite"></div>
      </div>

      <div class="chat-panel">
        <div class="chat-panel__head" id="chat-head"></div>
        <div class="chat-panel__listing" id="chat-listing" hidden></div>

        <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="История сообщений"></div>

        <div class="chat-composer">
          <button class="icon-btn" type="button" id="chat-attach" aria-label="Прикрепить файл">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5 12.6 19a4.6 4.6 0 0 1-6.5-6.5l7.7-7.7a3.1 3.1 0 1 1 4.4 4.4l-7.6 7.6a1.6 1.6 0 0 1-2.2-2.2l7-7"/></svg>
          </button>
          <input type="file" id="chat-file" hidden>

          <div class="chat-composer__field">
            <label class="visually-hidden" for="chat-input">Сообщение</label>
            <textarea id="chat-input" rows="1" placeholder="Напишите сообщение…" aria-describedby="chat-hint"></textarea>
            <span class="visually-hidden" id="chat-hint">Enter — отправить, Shift+Enter — новая строка</span>
          </div>

          <button class="chat-composer__send" type="button" id="chat-send" aria-label="Отправить сообщение">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 10.1Z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" data-site-footer></footer>

  <script type="module" src="/js/chat.js"></script>
</body>
</html>
